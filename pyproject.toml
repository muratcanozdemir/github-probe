[project]
name = "org-harvest"
version = "0.1.0"
description = "Download a complete, self-consistent GitHub organization snapshot via GraphQL, authenticating as a GitHub App installation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

authors = [
    {name = "Murat Can Ozdemir", email = "mrtcnozdemir@gmail.com"}
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving",
]

dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pyarrow>=17.0",
    "click>=8.1",
]

[project.scripts]
org-harvest = "org_harvest.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyarrow-stubs>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/org_harvest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
