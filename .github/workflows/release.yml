name: Release

# Tag-triggered release (AC-10.8): re-runs the full quality gate (via
# ci.yml as a reusable workflow), then builds the distribution, generates a
# CycloneDX SBOM, and attaches both to a GitHub Release for the pushed tag.
#
# Fails (AC-10.9) if the quality gate fails (`needs: quality`), if `uv
# build` doesn't produce both a wheel and an sdist, if the SBOM generation
# step doesn't produce valid JSON, or if any of the expected files are
# missing when the release action tries to attach them
# (`fail_on_unmatched_files: true`).
on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every third-party action below is pinned to a full commit SHA, with
      # the version it corresponds to recorded in a trailing comment
      # (AC-10.7) — a tag can move, a commit SHA cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build distribution
        run: uv build

      - name: Verify build artifacts exist
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheel (dist/*.whl) was produced by 'uv build'"
            exit 1
          fi
          if [ ${#sdists[@]} -eq 0 ]; then
            echo "::error::no sdist (dist/*.tar.gz) was produced by 'uv build'"
            exit 1
          fi

      # cyclonedx-bom is a Python tool, not a GitHub Action, so it's pinned
      # by exact version here rather than by commit SHA (that requirement
      # is specific to the actions above, AC-10.7).
      - name: Generate CycloneDX SBOM
        run: >-
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment
          --of json -o sbom.cdx.json --pyproject pyproject.toml
          .venv/bin/python

      - name: Verify the SBOM was produced
        run: |
          set -euo pipefail
          test -s sbom.cdx.json
          python3 -c "import json; json.load(open('sbom.cdx.json'))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
